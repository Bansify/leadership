<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f2" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const preference = localStorage.getItem('leadership-theme');
        if (preference === 'light' || preference === 'dark') {
          document.documentElement.setAttribute('data-theme', preference);
        }
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark = preference === 'dark' || (preference !== 'light' && prefersDark);
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', isDark ? '#212121' : '#f7f7f2');
      } catch {
        // The stylesheet still follows the device theme if storage is unavailable.
      }
    </script>
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <meta name="application-name" content="Bansify Leadership" />
    <meta name="description" content="Bansify builds consumer cloud software — Account, Mail and AI. Five people, five roles, one company at the earliest possible stage." />

    <title>Bansify — Leadership</title>
    <link rel="canonical" href="https://leadership.bansify.com/" />
    <link rel="icon" href="/assets/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:site_name" content="Bansify Leadership" />
    <meta property="og:title" content="Bansify — Leadership" />
    <meta property="og:description" content="Five people. Five roles. One company at the earliest possible stage." />

    <meta name="twitter:card" content="summary" />
